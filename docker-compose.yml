services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-shopnow}
      POSTGRES_USER: ${DATABASE_USER:-shopnow}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-shopnow_local_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-shopnow} -d ${DATABASE_NAME:-shopnow}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_HOST: postgres          # Compose service name, not localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-shopnow}
      DATABASE_USER: ${DATABASE_USER:-shopnow}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-shopnow_local_dev}
      REDIS_HOST: redis                # Compose service name, not localhost
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Empty => same-origin requests, proxied by nginx to the backend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    environment:
      BACKEND_HOST: backend            # Compose service name
      BACKEND_PORT: 8000
      FRONTEND_PORT: 80
      DNS_RESOLVER: 127.0.0.11         # Docker embedded DNS
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
