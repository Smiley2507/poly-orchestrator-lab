# Uses the same image built with VITE_API_BASE_URL="" as the ECS frontend -
# the browser calls this pod's own origin, and the Ingress below does the
# /api/* -> backend path routing, mirroring the ECS ALB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shopnow
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 888577065142.dkr.ecr.eu-west-1.amazonaws.com/poly-orchestrator-frontend:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shopnow
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
