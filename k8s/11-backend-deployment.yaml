# DATABASE_PASSWORD comes from a Secret created at deploy time, not committed
# here: `kubectl create secret generic backend-secret -n shopnow
# --from-literal=DATABASE_PASSWORD=<value>` (same value as terraform.tfvars'
# db_password, which is gitignored).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shopnow
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 888577065142.dkr.ecr.eu-west-1.amazonaws.com/poly-orchestrator-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shopnow
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
