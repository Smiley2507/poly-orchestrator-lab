# Split into two Ingress resources sharing one ALB via group.name, because
# alb.ingress.kubernetes.io/healthcheck-path applies per-Ingress, not per
# backend - the frontend and backend need different health check paths
# (frontend has no dedicated endpoint, "/" works; backend only has /health,
# not "/", which 404s).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopnow-ingress-backend
  namespace: shopnow
  annotations:
    alb.ingress.kubernetes.io/group.name: shopnow
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopnow-ingress-frontend
  namespace: shopnow
  annotations:
    alb.ingress.kubernetes.io/group.name: shopnow
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
